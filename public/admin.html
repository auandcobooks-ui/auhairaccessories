<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#410440">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>AU Admin · Dashboard</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/admin.webmanifest">
<meta name="apple-mobile-web-app-title" content="AU Admin">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
:root{--plum:#410440;--orchid:#C73CC5;--ink:#A0229E;--soft:#E58BE3;--blush:#FFE7FF;--night:#24021F;--bg:#F7F1F7;--card:#fff;--line:#EADCEA;--muted:#7A6479;--text:#24021F;--ok:#1E9E5A;--warn:#C9851A;--bad:#C22F3B;--navh:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;overflow-x:hidden;max-width:100%;overscroll-behavior:none}
body{touch-action:pan-y;position:relative}
img,svg{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ink)}
.top{position:sticky;top:0;z-index:20;background:var(--plum);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
.top img{height:28px}
.top .sp{flex:1}
.top select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:7px 8px;width:auto;max-width:150px;font-size:13px}
.top select option{color:#111}
.rbtn{display:inline-flex;align-items:center;gap:7px;background:#fff;color:var(--plum);border:0;border-radius:10px;padding:7px 11px;font-weight:700;cursor:pointer}
.rbtn svg{width:16px;height:16px}
.spin svg,.ptr.go svg{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.upd{font-size:11.5px;color:#E9CFE8;white-space:nowrap}
@media(max-width:560px){.upd{display:none}.rbtn span{display:none}}
/* nav: tabs on wide screens, bottom bar on phones */
.nav{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:48px;z-index:19}
.nav button{border:0;background:none;padding:9px 14px;border-radius:999px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;position:relative}
.nav button svg{width:18px;height:18px;display:none}
.nav button[aria-selected=true]{background:var(--blush);color:var(--plum)}
.nav .more{display:none}
.nav .bdg{background:var(--bad);color:#fff;font-size:10.5px;font-weight:800;border-radius:999px;min-width:18px;height:18px;padding:0 5px;display:inline-grid;place-items:center}
@media(max-width:759px){
  :root{--navh:64px}
  .nav{position:fixed;top:auto;bottom:0;left:0;right:0;border:0;border-top:1px solid var(--line);padding:6px 4px;padding-bottom:max(6px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:0;box-shadow:0 -8px 24px rgba(65,4,64,.08);z-index:40}
  .nav button{flex-direction:column;gap:2px;font-size:10.5px;padding:5px 2px;border-radius:12px;justify-content:center}
  .nav button svg{display:block}
  .nav button[aria-selected=true]{background:none;color:var(--plum)}
  .nav button[aria-selected=true] svg{color:var(--orchid)}
  .nav .x{display:none}.nav .more{display:flex}
  .nav .bdg{position:absolute;top:0;left:calc(50% + 4px)}
}
main{max-width:1180px;margin:0 auto;padding:16px 16px calc(110px + var(--navh))}
h2{font-size:20px;margin:6px 0 12px}
h3{font-size:15px;margin:0 0 10px}
.grid{display:grid;gap:12px}
.grid>*{min-width:0}
.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr 1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.kpi small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:2px;overflow-wrap:anywhere}
.kpi span{font-size:12px;color:var(--muted)}
.kpi .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--blush);color:var(--plum);margin-bottom:10px}
.kpi .ic svg{width:18px;height:18px}
.kpi.warn{background:#FFF6E6;border-color:#F4DDAF}.kpi.warn .ic{background:#FFE7B8;color:#8A5A00}
.hero{background:radial-gradient(120% 160% at 90% 0%,#7A1577 0%,#410440 50%,#24021F 100%);color:#fff;border:0;border-radius:22px;padding:20px;position:relative;overflow:hidden}
.hero small{color:#E9CFE8;font-weight:600;font-size:12.5px}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:4px 0 6px;overflow-wrap:anywhere}
.hero .sub{color:#F2DDF1;font-size:13px}
.hero .wm{position:absolute;right:-30px;bottom:-30px;width:180px;opacity:.08;pointer-events:none}
.hero .hrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.hero .hrow div{background:rgba(255,255,255,.09);border-radius:14px;padding:10px}
.hero .hrow b{display:block;font-size:17px}
.hero .hrow span{font-size:11.5px;color:#E9CFE8}
.row{display:flex;align-items:center;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 56px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.bar i{display:block;height:10px;border-radius:6px;background:var(--orchid);min-width:2px}
.bar .t{height:10px;background:#F3E6F3;border-radius:6px;overflow:hidden}
.bar em{font-style:normal;text-align:right;font-weight:600}
.lst{margin:0;padding:0;list-style:none}
.lst li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #F3E9F3;font-size:13px}
.lst li>span:last-child{text-align:right;overflow-wrap:anywhere;min-width:0}
.lst li:last-child{border:0}
.muted{color:var(--muted)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.s-new{background:#FFF2D9;color:#8A5A00}.s-confirmed{background:#DDF6E8;color:#147A43}.s-dispatched{background:#EFE4FF;color:#5B2BB5}.s-delivered{background:#D9F2EE;color:#0F6E61}.s-cancelled{background:#F5E1E3;color:#9B1E2A}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--plum);color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn svg{width:18px;height:18px;flex:none}
.btn.o{background:#fff;color:var(--plum);border:1.5px solid var(--line)}
.btn.g{background:#1DAA61;color:#fff}.btn.r{background:#fff;color:var(--bad);border:1.5px solid #F0C9CD}
.btn.w{width:100%}.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lnk{background:none;border:0;color:var(--muted);font-weight:600;text-decoration:underline;cursor:pointer;padding:6px 4px;font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer;font-size:12.5px}
.chips button[aria-pressed=true]{background:var(--plum);color:#fff;border-color:var(--plum)}
input[type=text],input[type=number],input[type=password],input[type=tel],input[type=search],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:16px}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.order{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;cursor:pointer}
.order:hover{border-color:var(--soft)}
.order b{font-size:15px}
.dots{display:inline-flex;gap:4px;vertical-align:middle;margin-right:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:#E2D2E1}.dots i.on{background:var(--ok)}
.chart{width:100%;height:auto;display:block}
.drawer{position:fixed;inset:0;z-index:50;display:none}
.drawer.on{display:block}
.drawer .sc{position:absolute;inset:0;background:rgba(36,2,31,.45)}
.drawer .pn{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--bg);overflow-y:auto;overflow-x:hidden;padding:16px 16px 100px;padding-top:max(16px,env(safe-area-inset-top));box-shadow:-20px 0 40px rgba(0,0,0,.2);overscroll-behavior:contain;touch-action:pan-y}
.items{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.items td,.items th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;overflow-wrap:anywhere}
.items th{color:var(--muted);font-size:11.5px;font-weight:600}
.items td.n,.items th.n{text-align:right;font-variant-numeric:tabular-nums}
/* progress tracker */
.trk{display:grid;grid-template-columns:repeat(4,1fr);position:relative;margin:4px 0 14px}
.trk .st{display:grid;justify-items:center;text-align:center;gap:4px;position:relative;z-index:1}
.trk .st i{width:30px;height:30px;border-radius:50%;background:#fff;border:2.5px solid #E2D2E1;display:grid;place-items:center;font-style:normal;font-weight:800;color:#fff;font-size:14px}
.trk .st.on i{background:var(--ok);border-color:var(--ok)}
.trk .st.cur i{box-shadow:0 0 0 5px #D5F2E1}
.trk .st b{font-size:12px}.trk .st small{font-size:10.5px;color:var(--muted);line-height:1.25}
.trk::before{content:"";position:absolute;left:12.5%;right:12.5%;top:14px;height:3px;background:#E2D2E1;border-radius:3px}
.trk .fill{position:absolute;left:12.5%;top:14px;height:3px;background:var(--ok);border-radius:3px;transition:width .3s}
.cxl{background:#FBEDEE;border:1px solid #F0C9CD;color:#9B1E2A;border-radius:14px;padding:12px;font-weight:600;margin-bottom:12px}
.rcp{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:start}
.rcp img{width:92px;border-radius:10px;border:1px solid var(--line);display:block;background:#fff;cursor:pointer}
.sent{color:var(--ok);font-weight:700;font-size:12.5px}
.av{width:42px;height:42px;border-radius:50%;background:var(--blush);color:var(--plum);display:grid;place-items:center;font-weight:800;flex:none}
.cust{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;cursor:pointer}
.cust:hover{border-color:var(--soft)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;background:#EFE4FF;color:#5B2BB5;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.tog{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;font-weight:600;user-select:none}
.tog input{appearance:none;width:40px;height:23px;border-radius:999px;background:#E2D2E1;position:relative;margin:0;cursor:pointer;transition:.15s;flex:none}
.tog input::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog input:checked{background:var(--ok)}.tog input:checked::after{left:20px}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}
.col{border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:8px}
.col .nm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.col .nm i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);flex:none}
.savebar{position:fixed;left:0;right:0;bottom:var(--navh);z-index:30;background:#fff;border-top:1px solid var(--line);padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));display:none;gap:10px;align-items:center;box-shadow:0 -10px 30px rgba(65,4,64,.1)}
@media(max-width:759px){.savebar{padding-bottom:12px}}
.savebar.on{display:flex}
.savebar .sp{flex:1;font-size:13px;color:var(--muted);min-width:0}
.audit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.audit.dn{opacity:.55}
.toast{position:fixed;left:16px;right:16px;margin:0 auto;width:max-content;max-width:calc(100% - 32px);top:calc(64px + env(safe-area-inset-top));background:var(--night);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;z-index:60;opacity:0;transition:.2s;pointer-events:none;text-align:center}
.toast.on{opacity:1}
.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(120% 90% at 70% 10%,#62105F,#410440 50%,#24021F);padding:20px}
.login .card{width:min(380px,100%);text-align:center;padding:28px}
.login img{height:44px;margin-bottom:10px}
.ev{font-size:12.5px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid #F3E9F3}
.ev:last-child{border:0}
.ev .ty{font-weight:700;color:var(--plum)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.att{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid #F3E9F3;cursor:pointer;align-items:center}
.att:last-child{border:0}
/* pull to refresh */
.ptr{position:fixed;left:50%;top:0;z-index:45;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:#fff;color:var(--plum);display:grid;place-items:center;box-shadow:0 6px 20px rgba(65,4,64,.25);transform:translateY(-60px);opacity:0;pointer-events:none}
.ptr svg{width:20px;height:20px}
.ptr.ease{transition:transform .25s,opacity .25s}
/* sheets / modal */
.sheet{position:fixed;inset:0;z-index:55;display:none;align-items:flex-end;justify-content:center;background:rgba(36,2,31,.45)}
.sheet.on{display:flex}
.sheet .bx{background:var(--bg);width:min(520px,100%);border-radius:22px 22px 0 0;padding:18px 16px;padding-bottom:max(18px,env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;overflow-x:hidden;touch-action:pan-y}
@media(min-width:760px){.sheet{align-items:center}.sheet .bx{border-radius:22px}}
.rframe{width:100%;height:72vh;border:0;border-radius:14px;background:#fff;display:block}
.mitem{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;font-weight:600;margin-bottom:8px;cursor:pointer;text-align:left}
.mitem svg{width:20px;height:20px;color:var(--orchid)}
.sendrow{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}.sendrow .btn{padding:11px 6px;font-size:13px}
.rprev{-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;width:100%;max-height:52vh;object-fit:contain;object-position:top;border-radius:14px;border:1px solid var(--line);background:#fff;display:block}
</style>
</head>
<body>
<div id="app"></div>
<div class="ptr" id="ptr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg></div>
<div class="toast" id="toast"></div>
<script>
(() => {
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const naira = (n) => "₦" + Math.round(n || 0).toLocaleString("en-NG");
const num = (n) => Number(n || 0).toLocaleString("en-NG");
const when = (iso) => iso ? new Date(iso).toLocaleString("en-NG", { timeZone: "Africa/Lagos", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : "";
const dateOnly = (iso) => iso ? new Date(iso).toLocaleDateString("en-NG", { timeZone: "Africa/Lagos", day: "numeric", month: "short", year: "numeric" }) : "";
const ago = (iso) => { const s = (Date.now() - new Date(iso)) / 1000; if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + "m ago"; if (s < 86400) return Math.floor(s / 3600) + "h ago"; return Math.floor(s / 86400) + "d ago"; };
const toast = (t) => { const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("on"), 2600); };
const first = (n) => String(n || "").trim().split(/\s+/)[0] || "there";
const initials = (n) => String(n || "?").trim().split(/\s+/).slice(0, 2).map((x) => x[0] || "").join("").toUpperCase() || "?";

const STEPS = ["new", "confirmed", "dispatched", "delivered"];
const SLABEL = { new: "New", confirmed: "Confirmed", dispatched: "Dispatched", delivered: "Delivered", cancelled: "Cancelled" };
const STEPTXT = { new: ["Received", "Order sent"], confirmed: ["Confirmed", "Paid"], dispatched: ["Dispatched", "On the way"], delivered: ["Delivered", "Done"] };
const COLOURS = [["black","Black","#161616"],["brown","Brown","#4A4033"],["dark-brown","Dark Brown","#3A2A1F"],["nude","Nude","#A98B6B"],["wine","Wine","#4E1C2E"],["red","Red","#B3202E"],["pink","Pink","#C3307F"],["purple","Purple","#3B1BA0"],["royal-blue","Royal Blue","#1B3CC6"],["sky-blue","Sky Blue","#4FA6E6"],["white","White","#ECEAE6"]];
const PRODUCTS = { regular: { name: "Regular Wig Cap", big: "bag", bigDz: 100 }, mixed: { name: "Mixed Colour Bag", big: "bag", bigDz: 100 }, diy: { name: "DIY Mesh Dome Cap", big: "carton", bigDz: 50 }, stretch: { name: "Stretch Mesh Dome Cap", big: "carton", bigDz: 50 } };
const EVLABEL = { page_view: "Visited", select_colour: "Picked colour", select_unit: "Switched unit", add_to_cart: "Added to cart", remove_from_cart: "Removed item", open_cart: "Opened cart", order_sent: "Sent order", click_whatsapp: "Tapped WhatsApp", click_social: "Tapped social link" };
const SHOP = { address: "Shop A1, by Bayelsa Plaza, BBA Trade Fair Complex, Lagos", phone: "0912 643 3425", ig: "@auhairaccessories", web: "auhairaccessories.com" };
const I = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  bag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
  hand: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l2 2a1 1 0 0 0 3-3"/><path d="M14 14l2.5 2.5a1 1 0 0 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/><path d="M21 3l1 11h-2M3 3L2 14l6.5 6.5a1 1 0 1 0 3-3M3 4h8"/></svg>',
  people: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/></svg>',
  box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>',

async function api(path, opt = {}) {
  const r = await fetch("/api/admin/" + path, { credentials: "same-origin", headers: { "content-type": "application/json" }, ...opt, body: opt.body ? JSON.stringify(opt.body) : undefined });
  if (r.status === 401 && path !== "login") { showLogin(); throw new Error("Not signed in"); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Request failed");
  return d;
}

// ---------- shell ----------

const TABS = [["overview", "Overview", "Home", I.home], ["orders", "Orders", "Orders", I.bag], ["customers", "Customers", "Customers", I.people], ["products", "Products & stock", "Stock", I.box], ["partners", "Partners", "Partners", I.hand, "x"], ["visitors", "Insights", "Insights", I.chart, "x"], ["activity", "Activity & undo", "Activity", I.undo, "x"], ["settings", "Settings", "Settings", I.gear, "x"]];

function go(tab) {
  if (S.draft && S.tab === "products" && diffSummary(S.catalog, S.draft).length && !confirm("Discard unsaved product changes?")) return;
  S.draft = null; S.tab = tab; closeDrawer(); $("#main").innerHTML = "";
  $$(".nav button[data-tab]").forEach((x) => x.setAttribute("aria-selected", String(x.dataset.tab === tab)));
  $("#morebtn").setAttribute("aria-selected", String(!!TABS.find((t) => t[0] === tab)[4]));
  scrollTo(0, 0); render();
}
async function render() { $("#savebar").classList.remove("on"); $("#savebar").innerHTML = ""; await ({ overview, orders, customers, partners, products, visitors, activity, settings })[S.tab](); stamp(); badge(); }
function stamp() { const u = $("#upd"); if (u) u.textContent = "Updated " + new Date().toLocaleTimeString("en-NG", { timeZone: "Africa/Lagos", hour: "numeric", minute: "2-digit" }); }
async function badge() { try { const d = S.cache.waiting ?? (await api("orders?status=new")).orders.length; S.cache.waiting = undefined; const b = $("#nbdg"); if (b) { b.hidden = !d; b.textContent = d; } } catch {} }
let busy = false;
async function refresh() {
  if (S.tab === "products" && S.draft && S.catalog && diffSummary(S.catalog, S.draft).length && !confirm("Refreshing will discard your unsaved product changes. Continue?")) return;
  if (busy) return; busy = true; const b = $("#rfr"); b.classList.add("spin");
  const drawerRef = $("#drawer").classList.contains("on") ? S.openRef : null;
  try { await render(); if (drawerRef) await openOrder(drawerRef, true); toast("Up to date"); } catch (e) { toast(e.message); } finally { b.classList.remove("spin"); busy = false; }
}
async function boot() { try { await api("me"); shell(); render(); } catch (e) { if (e.message !== "Not signed in") showLogin(e.message); } }

// ---------- pull down to refresh ----------
function setupPTR() {
  const P = $("#ptr"); let y0 = null, d = 0;
  const top = () => (document.scrollingElement || document.documentElement).scrollTop <= 0;
  const blocked = () => $("#drawer").classList.contains("on") || $("#sheet").classList.contains("on");
  addEventListener("touchstart", (e) => { if (busy || blocked() || e.touches.length !== 1 || !top()) { y0 = null; return; } y0 = e.touches[0].clientY; d = 0; P.classList.remove("ease"); }, { passive: true });
  addEventListener("touchmove", (e) => {
    if (y0 == null) return; d = e.touches[0].clientY - y0;
    if (d <= 0 || !top()) { P.style.opacity = 0; P.style.transform = "translateY(-60px)"; return; }
    if (e.cancelable) e.preventDefault();
    const pull = Math.min(110, d * 0.5);
    P.style.opacity = Math.min(1, pull / 50); P.style.transform = `translateY(${pull}px) rotate(${pull * 4}deg)`;
  }, { passive: false });
  addEventListener("touchend", async () => {
    if (y0 == null) return; const pull = Math.min(110, d * 0.5); y0 = null; P.classList.add("ease");
    if (pull >= 60) { P.style.transform = "translateY(70px)"; P.classList.add("go"); await refresh(); P.classList.remove("go"); }
    P.style.opacity = 0; P.style.transform = "translateY(-60px)";
  });
}

// ---------- charts ----------
function bars(rows, { label, value, fmt = num, max }) {
  const m = max || Math.max(1, ...rows.map(value));
  return rows.length ? rows.map((r) => `<div class="bar"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(label(r))}</span><span class="t"><i style="width:${(value(r) / m) * 100}%"></i></span><em>${fmt(value(r))}</em></div>`).join("") : `<p class="muted">No data yet.</p>`;
}
function dayKeys(days) { const d0 = new Date(Date.now() + 3600e3), keys = []; for (let i = days - 1; i >= 0; i--) { const d = new Date(d0); d.setUTCDate(d.getUTCDate() - i); keys.push(d.toISOString().slice(0, 10)); } return keys; }
function salesChart(dailyOrders, days) {
  const keys = dayKeys(days), map = Object.fromEntries(keys.map((k) => [k, { v: 0, s: 0, n: 0 }]));
  dailyOrders.forEach((r) => { if (map[r.d]) Object.assign(map[r.d], { v: r.v, s: r.sold, n: r.n }); });
  const W = 700, H = 200, P = 8, mv = Math.max(1, ...keys.map((k) => map[k].v)), bw = (W - P * 2) / keys.length;
  const svg = keys.map((k, i) => { const x = P + i * bw + bw * .14, w = Math.max(1, bw * .72), hv = (map[k].v / mv) * (H - 46), hs = (map[k].s / mv) * (H - 46);
    return `<rect x="${x}" y="${H - 24 - hv}" width="${w}" height="${hv}" rx="3" fill="#F1D3F0"><title>${k}: ${map[k].n} orders, ${naira(map[k].v)} sent, ${naira(map[k].s)} confirmed</title></rect><rect x="${x}" y="${H - 24 - hs}" width="${w}" height="${hs}" rx="3" fill="#410440"/>`; }).join("");
  const step = Math.ceil(keys.length / 7);
  const lbl = keys.map((k, i) => i % step === 0 ? `<text x="${P + i * bw + bw / 2}" y="${H - 6}" font-size="11" text-anchor="middle" fill="#7A6479">${new Date(k + "T12:00:00Z").toLocaleDateString("en-NG", { day: "numeric", month: "short" })}</text>` : "").join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sales per day">${svg}${lbl}</svg>
  <div class="row muted" style="font-size:12px;gap:16px;flex-wrap:wrap"><span><i style="display:inline-block;width:10px;height:10px;background:#410440;border-radius:3px"></i> Confirmed</span><span><i style="display:inline-block;width:10px;height:10px;background:#F1D3F0;border-radius:3px"></i> Sent, not yet confirmed</span></div>`;
}
function visitChart(daily, dailyOrders, days) {
  const keys = dayKeys(days), map = Object.fromEntries(keys.map((k) => [k, { v: 0, n: 0 }]));
  daily.forEach((r) => { if (map[r.d]) map[r.d].v = r.v; }); dailyOrders.forEach((r) => { if (map[r.d]) map[r.d].n = r.n; });
  const W = 700, H = 190, P = 26, mv = Math.max(1, ...keys.map((k) => map[k].v)), mo = Math.max(1, ...keys.map((k) => map[k].n)), bw = (W - P * 2) / keys.length;
  const barsSvg = keys.map((k, i) => { const h = (map[k].v / mv) * (H - 50); return `<rect x="${P + i * bw + bw * .15}" y="${H - 24 - h}" width="${Math.max(1, bw * .7)}" height="${h}" rx="2" fill="#E58BE3"><title>${k}: ${map[k].v} visitors, ${map[k].n} orders</title></rect>`; }).join("");
  const pts = keys.map((k, i) => `${P + i * bw + bw / 2},${H - 24 - (map[k].n / mo) * (H - 50)}`).join(" ");
  const step = Math.ceil(keys.length / 7);
  const lbl = keys.map((k, i) => i % step === 0 ? `<text x="${P + i * bw + bw / 2}" y="${H - 6}" font-size="10" text-anchor="middle" fill="#7A6479">${k.slice(5)}</text>` : "").join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily visitors and orders">${barsSvg}<polyline points="${pts}" fill="none" stroke="#410440" stroke-width="2.5"/>${keys.map((k, i) => map[k].n ? `<circle cx="${P + i * bw + bw / 2}" cy="${H - 24 - (map[k].n / mo) * (H - 50)}" r="3.5" fill="#410440"/>` : "").join("")}${lbl}</svg>
  <div class="row muted" style="font-size:12px;gap:16px;flex-wrap:wrap"><span><i style="display:inline-block;width:10px;height:10px;background:#E58BE3;border-radius:3px"></i> Visitors (max ${mv})</span><span><i style="display:inline-block;width:14px;height:3px;background:#410440;vertical-align:middle"></i> Orders (max ${mo})</span></div>`;
}

function evDetail(e) {

async function makeReceipt(ref, showReady) {
  toast("Making receipt…");
  try {
    const o = await getOrder(ref, true);
    const { img, og } = await drawReceipt(o);
    const d = await api(`orders/${ref}/receipt`, { method: "POST", body: { img, og } });

function drawCustomers() {

function exportCustomers() {
  const cols = ["name", "phone", "state", "lga", "park", "address", "orders", "soldOrders", "sold", "dozens", "first", "last", "notes"];
  const cell = (v) => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const csv = [cols.join(","), ...S.customers.map((c) => cols.map((k) => cell(c[k])).join(","))].join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `au-customers-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
}

    <button class="btn" id="sst" style="margin-top:12px">Save &amp; publish</button></div>
  <div class="card" style="margin-top:12px"><h3>Ads tracking (pixels)</h3><p class="muted" style="margin:-4px 0 8px">Paste your Pixel IDs so Facebook, Instagram and TikTok ads can see who visits, adds to cart and sends orders. Leave empty to switch a pixel off.</p>
    <label class="f">Meta Pixel ID (Facebook &amp; Instagram)</label><input type="text" inputmode="numeric" id="mpx" placeholder="e.g. 1234567890123456" value="${esc(c.store.metaPixel || "")}">
    <p class="hint">Meta Events Manager → Data sources → your pixel → the number under its name.</p>
    <label class="f">TikTok Pixel ID (optional)</label><input type="text" id="tpx" placeholder="e.g. CABC123DEF456GHI789" value="${esc(c.store.tiktokPixel || "")}">
    <p class="hint">Events sent: page view, product view (colour picked), add to cart, checkout started (cart opened), lead (order sent on WhatsApp), contact (WhatsApp tapped).</p>
    <button class="btn" id="spx" style="margin-top:12px">Save &amp; publish</button></div>
  <div class="card" style="margin-top:12px"><h3>Links</h3><ul class="lst"><li><span>Store</span><a href="/" target="_blank">auhairaccessories.com</a></li><li><span>Orders export</span><a href="/api/admin/export/orders.csv">Download CSV</a></li><li><span>Visitor export</span><a href="/api/admin/export/events.csv">Download CSV</a></li></ul></div>
  <div class="card" style="margin-top:12px"><h3>Partner proposals</h3><p class="muted" style="margin:-4px 0 8px">Used in every partnership proposal you send to wig businesses.</p>
    <label class="f" for="pyn">Your name (signs the messages)</label><input type="text" id="pyn">
    <label class="f" for="pof">What partners get (one per line, as Title: short description)</label><textarea id="pof" style="min-height:170px"></textarea>
    <label class="f" for="pcl">Extra for businesses that also teach (Title: short description)</label><input type="text" id="pcl">
    <label class="f" for="psk">Web search key (Brave Search API)</label><input type="password" id="psk" placeholder="Paste key to turn on live search" autocomplete="off"><p class="hint" id="pskh"></p>
    <button class="btn" id="psave" style="margin-top:12px">Save</button></div>
  <div class="card" style="margin-top:12px"><h3>Change password</h3><p class="muted" style="margin:-4px 0 8px">Changing it signs out every other phone or computer using the dashboard.</p>
    <label class="f" for="pw0">Current password</label><input type="password" id="pw0" autocomplete="current-password">
    <label class="f" for="pw1">New password (at least 8 characters)</label><input type="password" id="pw1" autocomplete="new-password">
    <label class="f" for="pw2">Type the new password again</label><input type="password" id="pw2" autocomplete="new-password">
    <label class="tog" style="margin-top:10px"><input type="checkbox" id="pwshow">Show passwords</label>
    <button class="btn" id="pwsave" style="margin-top:12px;display:flex">Update password</button></div>
  <div class="card" style="margin-top:12px"><h3>Account</h3><button class="btn r" id="out">Sign out</button></div>`;
  api("partner-config").then((pc) => { $("#pyn").value = pc.yourName; $("#pof").value = pc.offer.join("\n"); $("#pcl").value = pc.classOffer || ""; $("#pskh").textContent = pc.hasSearchKey ? "A key is saved. Paste a new one only to replace it." : "No key yet, so Partners search is off. Get a free key at api-dashboard.search.brave.com, then paste it here."; }).catch(() => {});
  $("#psave").onclick = async () => { const b = { yourName: $("#pyn").value, offer: $("#pof").value.split("\n"), classOffer: $("#pcl").value }; if ($("#psk").value.trim()) b.searchKey = $("#psk").value.trim();
    try { const r = await api("partner-config", { method: "PUT", body: b }); S.pcfg = r; $("#psk").value = ""; $("#pskh").textContent = r.hasSearchKey ? "A key is saved. Paste a new one only to replace it." : "No key yet."; toast("Saved"); } catch (e) { toast(e.message); } };
  $("#pwshow").onchange = () => ["#pw0", "#pw1", "#pw2"].forEach((k) => ($(k).type = $("#pwshow").checked ? "text" : "password"));
  $("#pwsave").onclick = async () => {
    const cur = $("#pw0").value, a = $("#pw1").value, b2 = $("#pw2").value;
    if (!cur) return toast("Enter your current password");
    if (a.length < 8) return toast("New password needs at least 8 characters");
    if (a !== b2) return toast("The two new passwords don't match");
    $("#pwsave").disabled = true;
    try { await api("password", { method: "POST", body: { current: cur, next: a } }); ["#pw0", "#pw1", "#pw2"].forEach((k) => ($(k).value = "")); toast("Password updated"); }
    catch (e) { toast(e.message); } finally { $("#pwsave").disabled = false; }
  };
  $("#sst").onclick = async () => { const next = JSON.parse(JSON.stringify(c)); next.store.announcement = $("#ann").value.trim(); next.store.whatsapp = $("#wa").value.replace(/\D/g, "");
    if (next.store.whatsapp.length < 10) return toast("Check the WhatsApp number");
    const ch = []; if (next.store.announcement !== (c.store.announcement || "")) ch.push(next.store.announcement ? `Announcement: "${next.store.announcement}"` : "Announcement removed"); if (next.store.whatsapp !== c.store.whatsapp) ch.push(`WhatsApp number → ${next.store.whatsapp}`);
    if (!ch.length) return toast("Nothing changed");
    try { await api("catalog", { method: "PUT", body: { catalog: next, summary: ch.join("; ") } }); toast("Saved · live on the store now"); settings(); } catch (e) { toast(e.message); } };
  $("#spx").onclick = async () => { const next = JSON.parse(JSON.stringify(c)); const mm = $("#mpx").value.replace(/\s/g, ""), t = $("#tpx").value.trim().toUpperCase();
    if (mm && !/^\d{8,20}$/.test(mm)) return toast("Meta Pixel ID should be numbers only");
    if (t && !/^[A-Z0-9]{10,30}$/.test(t)) return toast("Check the TikTok Pixel ID");
    next.store.metaPixel = mm; next.store.tiktokPixel = t;
    const ch = []; if (mm !== (c.store.metaPixel || "")) ch.push(mm ? `Meta Pixel set to ${mm}` : "Meta Pixel removed"); if (t !== (c.store.tiktokPixel || "")) ch.push(t ? `TikTok Pixel set to ${t}` : "TikTok Pixel removed");
    if (!ch.length) return toast("Nothing changed");
    try { await api("catalog", { method: "PUT", body: { catalog: next, summary: ch.join("; ") } }); toast("Saved · pixel live on the store"); settings(); } catch (e) { toast(e.message); } };
  $("#out").onclick = async () => { await api("logout", { method: "POST" }).catch(() => {}); showLogin(); };
}

boot();
})();
</script>
</body>
</html>
